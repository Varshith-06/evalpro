<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EvalPro</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>E</text></svg>" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">E</span><b>EvalPro</b></div>
      <div class="who">
        <label>View as</label>
        <div class="roles" id="role-switch">
          <button type="button" data-role="student">Student</button>
          <button type="button" data-role="faculty">Faculty</button>
          <button type="button" data-role="admin">Admin</button>
        </div>
      </div>
      <div class="who">
        <label for="user-select">Person</label>
        <select id="user-select"></select>
      </div>
      <div class="who">
        <label for="course-select">Course</label>
        <select id="course-select"></select>
      </div>
      <nav class="menu" id="menu"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="actions" id="topbar-actions"></div>
      </header>
      <div class="page" id="page"><div class="loading">Loading…</div></div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
